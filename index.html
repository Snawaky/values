<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Топ ценностей</title>

<style>
/* ===== Цвета и шрифты ===== */
:root {
  --bg: #F9F8F6;
  --paper: #FFFFFF;
  --text: #333333;
  --muted: #828282;
  --line: #EBEBEB;
  --line-d: #D1D1D1;
  --green: #60806E;
  --green-d: #496355;
  --green-l: #F0F4F2;
  --yellow: #DEB853;
  --yellow-l: #FCF9F0;
  --gap: 16px; /* расстояние между колонками в итогах */
}

body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.6 system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}
h1 { font: 600 24px/1.3 system-ui, sans-serif; margin: 24px 0 12px; color: #222; }
p { margin: 0 0 16px; }
.hint { color: var(--muted); font-size: 15px; margin: 0; line-height: 1.5; }
.note { font-size: 14px; margin-bottom: 16px; }          /* пояснение под заголовком раздела */
.intro-time { color: var(--muted); margin-top: 24px; }   /* «Займёт около...» */
.consent { flex: 1; min-width: 0; display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--muted); line-height: 1.4; cursor: pointer; }
.consent input { flex: none; margin: 2px 0 0; accent-color: var(--green); }
.consent + .grow { display: none; }

/* ===== Карточка ===== */
.frame {
  max-width: 680px; margin: 40px auto;
  max-height: calc(100vh - 80px);
  max-height: calc(100dvh - 80px);
  background: var(--paper);
  border-radius: 32px;
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.05);
  display: flex; flex-direction: column; overflow: hidden;
}
.head { flex: none; padding: 32px 40px 16px; border-bottom: 1px solid var(--line); background: var(--paper); z-index: 10; transition: box-shadow 0.3s; }
.head .hint { min-height: 44px; }
.body { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 40px 32px; }
.foot { flex: none; padding: 20px 40px 24px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 12px; background: #FAFAFA; z-index: 10; transition: box-shadow 0.3s; }
.grow { flex: 1; }

/* Тени для длинных списков */
.step-pick .head, .step-result .head { box-shadow: 0 15px 15px -15px rgba(0, 0, 0, 0.1); }
.step-pick .foot, .step-result .foot { box-shadow: 0 -15px 15px -15px rgba(0, 0, 0, 0.1); }

/* ===== Шапка ===== */
.row { display: flex; align-items: center; justify-content: space-between; min-height: 22px; }
.stepno { font-size: 13px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.progress-count { font-size: 14px; font-weight: 600; color: var(--muted); }
.bar { height: 6px; background: var(--line); border-radius: 3px; margin: 16px 0 0; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); transition: width 0.4s ease; border-radius: 3px; }

/* ===== Кнопки ===== */
button {
  font: inherit; font-weight: 500; color: var(--text); background: var(--paper);
  border: 1px solid var(--line-d); border-radius: 14px; padding: 12px 24px;
  cursor: pointer; transition: all 0.2s;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
button:disabled { opacity: 0.4; pointer-events: none; }
button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

.primary { background: var(--green); color: #fff; border-color: var(--green); box-shadow: 0 4px 12px rgba(96, 128, 110, 0.2); }
.ghost { background: none; border: none; color: var(--muted); padding: 12px; }
.back { background: none; border: 1px solid transparent; padding: 12px 16px; color: var(--text); }

/* ===== Шаг 1 ===== */
.cloud { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border-radius: 20px; font-size: 14px; padding: 6px 14px; font-weight: 400; background: #fff; }
.chip:disabled { opacity: 0.4; }
.chip.on { background: var(--green); color: #fff; border-color: var(--green); }

/* Выбранные слова — отдельная плашка над кнопками */
.tray { order: -1; flex-basis: 100%; background: var(--green-l); border-radius: 16px; padding: 10px 12px; margin-bottom: 4px; }
.tray-h { font-size: 13px; font-weight: 600; color: var(--green-d); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; max-height: 68px; overflow-y: auto; margin-top: 8px; }
.tags:empty { display: none; }
.tags.more { -webkit-mask-image: linear-gradient(to bottom, #000 55%, transparent); mask-image: linear-gradient(to bottom, #000 55%, transparent); }
.foot .tag { font-size: 13px; font-weight: 400; padding: 4px 10px; border-radius: 16px; background: #fff; border: 1px solid var(--line-d); color: var(--text); box-shadow: none; }
.tag span { color: var(--muted); margin-left: 4px; }

/* ===== Шаг 2 ===== */
.opts-title { font-weight: 600; margin: 0 0 12px; color: var(--green); font-size: 14px; text-transform: uppercase; letter-spacing: 0.02em; text-align: left; }
.opts-title.low { color: #B38914; }
.opts { display: flex; flex-direction: column; gap: 8px; width: 100%; margin: 0; }

.opt {
  width: 100%; box-sizing: border-box;
  display: flex; flex-wrap: nowrap; align-items: center; gap: 8px 12px;
  text-align: left; font-size: 16px; padding: 12px 16px;
  border-radius: 14px; font-weight: 500;
  background: var(--bg); border: 1px solid transparent;
}
.opt .k { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; color: var(--muted); background: #fff; border: none; font-weight: 600; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }

/* Подпись справа: скрыта, пока вариант не выбран */
.opt::after { display: none; margin-left: auto; flex: 0 1 auto; line-height: 1.1; text-align: right; font-size: 12px; font-weight: 600; }
.opt.on::after, .opt.no::after { display: block; }

.on { background: var(--green); color: #fff; border-color: var(--green); box-shadow: 0 6px 16px rgba(96, 128, 110, 0.25); }
.opt.on .k { color: var(--green); background: #fff; }
.opt.on::after { content: 'Самая важная'; opacity: 0.9; }

.no { background: var(--yellow-l); border-color: var(--yellow); }
.opt.no .k { background: #fff; color: #D4A72C; }
.opt.no::after { content: 'Наименее важная'; color: #B38914; }

/* ===== Наведение (только мышь) ===== */
@media (hover: hover) and (pointer: fine) {
  button:hover:not(:disabled):not(.on):not(.no):not(.ghost):not(.primary):not(.back) { border-color: var(--muted); }
  .primary:hover:not(:disabled) { background: var(--green-d); border-color: var(--green-d); }
  .ghost:hover { color: var(--text); background: rgba(0, 0, 0, .05); }
  .back:hover { background: rgba(0, 0, 0, .05); border-color: transparent; }
  .chip:hover:not(.on):not(:disabled) { background: var(--green-l); border-color: var(--green); }
  .best .opt:hover:not(.on) { background: var(--green-l); border-color: var(--green); }
  .worst .opt:hover:not(.on):not(.no) { background: var(--yellow-l); border-color: var(--yellow); }
}

@media (hover: hover) and (pointer: fine) and (prefers-color-scheme: dark) {
  .ghost:hover, .back:hover { background: rgba(255,255,255,.05); }
}

/* ===== Нажатие (телефон) ===== */
@media (hover: none) {
  button:active:not(:disabled) { transform: scale(0.97); }
  .chip:active:not(.on):not(:disabled) { background: var(--green-l); border-color: var(--green); }
  .ghost:active, .back:active { background: var(--line); }
  .primary:active:not(:disabled) { background: var(--green-d); border-color: var(--green-d); }
}

/* ===== Результат ===== */
.res {
  column-count: 2; column-gap: var(--gap);
  list-style: none; padding: 0; margin: 0; display: block;
}
.res li {
  display: flex; gap: 10px; align-items: center;
  font-weight: 500; font-size: 15px;
  margin-bottom: 0; padding-bottom: 8px; break-inside: avoid;
  min-width: 0; overflow-wrap: anywhere; hyphens: manual;
}
.res li .num { color: var(--muted); font-weight: 600; width: 24px; text-align: right; flex: none; }
.res li .dot { color: var(--muted); opacity: 0.5; width: 18px; text-align: right; flex: none; }

.divider { height: 1px; background: var(--line); border: none; margin: 32px 0; }
.sub { font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 4px; }

/* Сложный выбор: текст на одной линии с верхними блоками,
   счёт посередине между самым длинным левым словом и правой колонкой */
.res.conf {
  column-count: auto; display: grid;
  grid-template-columns: auto 1fr calc(50% - var(--gap) / 2 - 34px);
}
.res.conf li {
  grid-column: 1 / -1; display: grid; grid-template-columns: subgrid;
  align-items: center; font-weight: 400; font-size: 14px;
  gap: 0; padding: 6px 0; margin-bottom: 0; border-bottom: 1px dashed var(--line);
}
.res.conf li:last-child { border-bottom: none; }
.res.conf .v { grid-column: 1; padding-left: 34px; }
.res.conf .score { grid-column: 2; text-align: center; padding: 0 12px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.res.conf .r { grid-column: 3; }
.res.conf .v, .res.conf .r { min-width: 0; overflow-wrap: anywhere; hyphens: auto; }

/* ===== Поддержать автора ===== */
.support { margin-top: 32px; padding: 24px 32px; background: var(--green-l); border-radius: 16px; display: flex; align-items: center; justify-content: space-between; gap: 24px; text-align: left; }
.support-text { flex: 1; }
.support .hint { font-size: 14px; color: var(--text); margin-bottom: 16px; line-height: 1.5; }
.support-link { display: inline-block; background: #fff; color: var(--green); border: 1px solid var(--green); padding: 8px 16px; border-radius: 12px; text-decoration: none; font-weight: 500; font-size: 14px; transition: 0.2s; }
.support-link:hover { background: var(--green); color: #fff; }
.support-qr { flex: none; width: 100px; border-radius: 12px; mix-blend-mode: multiply; }

/* ===== Телефон ===== */
@media (max-width: 600px) {
  :root { --gap: 8px; }
  .frame { margin: 0; border-radius: 0; max-height: none; height: 100vh; height: 100dvh; box-shadow: none; border: none; }
  .head { padding: 24px 20px 16px; }
  .body { padding: 16px 20px 24px; }
  .foot { padding: 16px 20px; gap: 4px; }
  .foot button { padding: 12px 12px; font-size: 14px; white-space: nowrap; }
  .foot .ghost, .foot .back { padding: 12px 6px; }
  .foot .primary { margin-left: auto; }

  .tray { min-width: 0; max-width: 100%; }
  .tags { flex-wrap: nowrap; overflow-x: auto; max-height: none; min-width: 0; -webkit-overflow-scrolling: touch; }
  .tags.more { -webkit-mask-image: linear-gradient(to right, #000 75%, transparent); mask-image: linear-gradient(to right, #000 75%, transparent); }
  .foot .tag { flex: none; }

  h1 { font-size: 22px; margin-top: 16px; }
  .res li { font-size: 14px; align-items: baseline; }
  .res.conf li { align-items: center; }
  .res.conf .score { padding: 0 8px; }

  .support { flex-direction: column; text-align: center; padding: 20px; gap: 16px; }
  .support-qr { display: none; }

   /* Итоги: больше места для слов в двух колонках */
  .body { padding-left: 16px; padding-right: 16px; }
  .res li { gap: 6px; }
  .res.conf { grid-template-columns: auto 1fr calc(50% - var(--gap) / 2 - 30px); }
  .res.conf .v { padding-left: 30px; }
}

/* Запасной вариант для старых iOS (до 16) */
@supports not (grid-template-columns: subgrid) {
  .res.conf { display: block; }
  .res.conf li { display: grid; grid-template-columns: 1fr auto 1fr; }
}

/* ===== Тёмная тема ===== */
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #16181A;
    --paper: #1F2225;
    --text: #E2E2DF;
    --muted: #9A9D9F;
    --line: #2E3236;
    --line-d: #3A3F44;
    --green: #4A6B5A;
    --green-d: #3F5C4D;
    --green-l: #1F2B25;
    --yellow: #C9A54A;
    --yellow-l: #2B271C;
    --green-t: #93B5A1;
  }

  h1 { color: #F0F0EC; }
  .frame { box-shadow: 0 16px 48px rgba(0,0,0,.5); }
  .foot { background: #1A1D20; }
  .step-pick .head, .step-result .head { box-shadow: 0 15px 15px -15px rgba(0,0,0,.6); }
  .step-pick .foot, .step-result .foot { box-shadow: 0 -15px 15px -15px rgba(0,0,0,.6); }

  .primary, .on { box-shadow: none; }
  .chip, .foot .tag { background: var(--paper); }

  .tray-h { color: var(--green-t); }
  .opts-title, .opts-title.low { color: var(--muted); }
  .opt.no::after { color: var(--yellow); }

  .opt .k { background: var(--paper); box-shadow: none; }
  .opt.on .k { background: #E8EEEA; color: var(--green-d); }
  .opt.no .k { background: var(--paper); color: var(--yellow); }

  .support { background: #272B2F; }
  .support-link { background: transparent; color: var(--text); border-color: #4A5057; }
  .support-link:hover { background: var(--green); border-color: var(--green); color: #EDEFEC; }
  .support-qr { mix-blend-mode: normal; background: #fff; padding: 6px; box-sizing: border-box; }
}

/* ===== Полоса прокрутки ===== */
.body { scrollbar-color: var(--line-d) transparent; }
.body::-webkit-scrollbar { width: 14px; }
.body::-webkit-scrollbar-thumb {
  background: var(--line-d); border-radius: 7px;
  border: 3px solid transparent; background-clip: padding-box;
}
.body::-webkit-scrollbar-thumb:hover { background-color: var(--muted); }
.body::-webkit-scrollbar-button { display: none; }
</style>
</head>

const MAX_PICK = 16;   // максимум ценностей на шаге 1

/* --- Технические настройки --- */
const STORAGE_KEY = 'values-now-v26'; // смена ключа сбросит сохранённый прогресс
const BIG_POOL = 12;          // если выбрано больше — каждую ценность показываем чаще

const MAX_CONFLICTS = 4;      // сколько пар показать в «Сложном выборе»

/* =========================================================
   СОСТОЯНИЕ (сохраняется в localStorage)
   step      — текущий экран: intro / pick / compare / result
   order     — все ценности в случайном порядке
   sel       — выбранные на шаге 1
   pool      — ценности, которые сравниваются на шаге 2
   design    — наборы ценностей для каждого экрана сравнения
   ans       — ответы на экранах: { best, worst }
   curBest   — отмеченная «самая важная» на текущем экране
   curWorst  — отмеченная «наименее важная» на текущем экране
   tb        — ответы на уточняющих экранах (при ничьей)
   result    — топ, rest — остальные, date — дата прохождения
   sid       — случайный номер прохождения (для статистики)
   consent   — согласие на отправку статистики
   ========================================================= */
let state;

const app = document.getElementById('app');
const $ = id => document.getElementById(id);
document.title = NAME;

/* =========================================================
   ВСПОМОГАТЕЛЬНОЕ
   ========================================================= */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

// Ключ для пары «A против B» (порядок важен)
const pairKey = (a, b) => a + '\u0001' + b;
// Ключ для пары без учёта порядка
const unorderedKey = (a, b) => a < b ? pairKey(a, b) : pairKey(b, a);

// Вызвать fn для каждой пары элементов массива
function forEachPair(arr, fn) {
  for (let i = 0; i < arr.length; i++)
    for (let j = i + 1; j < arr.length; j++) fn(arr[i], arr[j]);
}

function shuffle(list) {
  const arr = list.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.random() * (i + 1) | 0;
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

const today = () => new Date().toLocaleDateString('ru-RU');
const newSid = () => Math.random().toString(36).slice(2, 10);

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    const validStep = saved && ['intro', 'pick', 'compare', 'result'].includes(saved.step);
    if (validStep && Array.isArray(saved.order)) {
      if (!saved.sid) saved.sid = newSid();
      if (saved.consent === undefined) saved.consent = false;
      return saved;
    }
  } catch (e) {}
  return null;
}

// Идёт ли уточнение (все обычные экраны сравнения уже пройдены)
const isTieBreak = () => state.ans.length >= state.design.length;

/* =========================================================
   СТАТИСТИКА
   Отправляются только действия и время. Выбранные ценности — нет.
   ========================================================= */
let logBuf = [], lastScreen = null;

function log(e, extra) {
  if (!LOG_URL || !state || !state.consent) return;
  logBuf.push(Object.assign({ e, at: lastScreen ? lastScreen.key : state.step }, extra));
}

function flush() {
  if (!logBuf.length || !LOG_URL || !navigator.sendBeacon) { logBuf = []; return; }
  navigator.sendBeacon(LOG_URL, JSON.stringify({
    sid: state.sid,
    device: matchMedia('(hover: none)').matches ? 'телефон' : 'компьютер',
    pool: state.pool.length,
    events: logBuf
  }));
  logBuf = [];
}

// Активное время на экране: без периодов, когда вкладка была скрыта
function activeMs() {
  return lastScreen.active + (lastScreen.start ? Date.now() - lastScreen.start : 0);
}

// Экран сменился: записываем время на прошлом и открытие нового
function trackScreen() {
  const step = state.step === 'compare' && isTieBreak() ? (findTie() ? 'tie' : 'result') : state.step;
  const key = step + ':' + state.ans.length + ':' + state.tb.length;
  if (lastScreen && lastScreen.key === key) return;
  if (lastScreen) log('screen', { at: lastScreen.key, ms: activeMs() });
  lastScreen = { key, start: document.hidden ? null : Date.now(), active: 0 };
  log('open');
  flush();
}

// Закрыл или свернул страницу: ставим таймер на паузу
document.addEventListener('visibilitychange', () => {
  if (!lastScreen) return;
  if (document.visibilityState === 'hidden') {
    lastScreen.active = activeMs();
    lastScreen.start = null;
    log('leave', { ms: lastScreen.active });
    flush();
  } else {
    if (!lastScreen.start) lastScreen.start = Date.now();
    log('return');
  }
});

/* =========================================================
   ОТРИСОВКА

function render(keepScroll) {

}

function go(step) {

}

/* --- Шаблоны кнопок --- */

/* =========================================================

/* =========================================================
   ЭКРАН: ШАГ 1 — ВЫБОР ЦЕННОСТЕЙ
   ========================================================= */
function pick() {
  const cloud = state.order
    .map(v => `<button class="chip ${state.sel.includes(v) ? 'on' : ''}" data-act="toggle" data-v="${esc(v)}">${esc(v)}</button>`)
    .join('');

  frame(
    `<div class="row"><span class="stepno">Шаг 1 из 2</span></div>
     <div class="bar"></div>
     <h1>Какие ценности тебе ближе?</h1>
     <p class="hint">Список длинный, пролистай его до конца и выбери не больше ${MAX_PICK}</p>`,
    `<div class="cloud">${cloud}</div>`,
    backBtn('go', 'intro') + resetBtn(),
    `<div class="tray"><div id="cnt" class="tray-h"></div><div id="tags" class="tags"></div></div>
     <button id="next" class="primary" data-act="afterPick">Продолжить →</button>`
  );
  updatePick();
}

function toggle(v, el) {
  const i = state.sel.indexOf(v);
  if (i >= 0) state.sel.splice(i, 1);
  else if (state.sel.length < MAX_PICK) state.sel.push(v);
  else return;

  el.classList.toggle('on');
  updatePick();
  save();
}

function untick(v) {
  state.sel = state.sel.filter(x => x !== v);
  document.querySelectorAll('.chip').forEach(c => { if (c.dataset.v === v) c.classList.remove('on'); });
  updatePick();
  save();
}

// Обновить счётчик, кнопку «Продолжить» и плашку выбранных слов
function updatePick() {
  const n = state.sel.length;

  $('cnt').textContent =
    n === 0         ? 'Пока ничего не выбрано' :
    n < MIN_PICK    ? `Выбрано ${n} из ${MAX_PICK} (нужно ещё хотя бы ${MIN_PICK - n})` :
    n >= MAX_PICK   ? `Выбрано ${MAX_PICK} из ${MAX_PICK}. Это максимум!` :
                      `Выбрано ${n} из ${MAX_PICK}. Можно продолжить или добавить ещё.`;

  $('next').disabled = n < MIN_PICK;

  document.querySelectorAll('.chip').forEach(c => {
    c.disabled = n >= MAX_PICK && !state.sel.includes(c.dataset.v);
  });

  $('tags').innerHTML = state.sel.slice().reverse()
    .map(v => `<button class="tag" data-act="untick" data-v="${esc(v)}">${esc(v)}<span>×</span></button>`)
    .join('');
  $('tags').scrollTo(0, 0);
  updateFade();
}

// Тускнеющий край, если выбранные слова не помещаются
function updateFade() {
  const tags = $('tags');
  if (!tags) return;
  const hiddenX = tags.scrollWidth - tags.clientWidth - tags.scrollLeft;
  const hiddenY = tags.scrollHeight - tags.clientHeight - tags.scrollTop;
  tags.classList.toggle('more', hiddenX > 2 || hiddenY > 2);
}
app.addEventListener('scroll', e => { if (e.target.id === 'tags') updateFade(); }, true);
window.addEventListener('resize', updateFade);

function afterPick() {
  state.pool = state.order.filter(v => state.sel.includes(v));
  state.sel = state.pool.slice();
  startCompare();
}

/* =========================================================
   РАСКЛАДКА ЭКРАНОВ СРАВНЕНИЯ
   Цель: каждая ценность появляется одинаково часто,
   а пары встречаются на одном экране как можно равномернее.
   ========================================================= */
function startCompare() {
  const shows = state.pool.length > BIG_POOL ? SHOWS_BIG : SHOWS_SMALL;
  state.design = makeDesign(state.pool, shows);
  state.ans = [];
  state.curBest = null;
  state.curWorst = null;
  state.tb = [];
  go('compare');
}

// Перебрать несколько случайных раскладок и взять самую ровную
function makeDesign(items, shows) {
  const perScreen = items.length >= 8 ? 4 : 3;
  const screenCount = Math.ceil(items.length * shows / perScreen);

  let best = null, bestCost = Infinity;
  for (let t = 0; t < DESIGN_TRIES; t++) {
    const attempt = buildDesign(items, screenCount, perScreen);
    const cost = designCost(items, attempt, shows);
    if (cost < bestCost) { bestCost = cost; best = attempt.screens; }
  }
  return best;
}

// Одна случайная раскладка
function buildDesign(items, screenCount, perScreen) {
  const shown = {};     // сколько раз ценность уже показана
  const together = {};  // сколько раз пара была на одном экране
  const screens = [];
  items.forEach(v => { shown[v] = 0; });

  for (let s = 0; s < screenCount; s++) {
    const screen = [];
    while (screen.length < perScreen) screen.push(pickNext(items, screen, shown, together));

    screen.forEach(v => shown[v]++);
    forEachPair(screen, (a, b) => {
      const k = unorderedKey(a, b);
      together[k] = (together[k] || 0) + 1;
    });
    screens.push(shuffle(screen));
  }
  return { screens, shown, together };
}

// Следующая ценность для экрана: реже показанная и реже встречавшаяся с уже выбранными
function pickNext(items, screen, shown, together) {
  const SHOWN_WEIGHT = 100; // равномерность показов важнее всего
  const MET_WEIGHT = 10;    // затем — разнообразие пар

  let bestV = null, bestCost = Infinity;
  for (const v of items) {
    if (screen.includes(v)) continue;
    let met = 0;
    for (const u of screen) met += together[unorderedKey(u, v)] || 0;
    const cost = shown[v] * SHOWN_WEIGHT + met * MET_WEIGHT + Math.random();
    if (cost < bestCost) { bestCost = cost; bestV = v; }
  }
  return bestV;
}

// Штраф за неравномерность раскладки: чем меньше, тем лучше
function designCost(items, { shown, together }, shows) {
  const pairCounts = [];
  forEachPair(items, (a, b) => pairCounts.push(together[unorderedKey(a, b)] || 0));

  const mean = pairCounts.reduce((sum, p) => sum + p, 0) / pairCounts.length;
  const pairSpread = pairCounts.reduce((sum, p) => sum + (p - mean) ** 2, 0);
  const showSpread = Object.values(shown).reduce((sum, c) => sum + (c - shows) ** 2 * 10, 0);
  return pairSpread + showSpread;
}

/* =========================================================
   ПОДСЧЁТ РЕЗУЛЬТАТА
   ========================================================= */

/* Сколько раз A оказалась важнее B: wins[pairKey(A, B)]
   На каждом экране «самая важная» обходит всех,
   а все остальные обходят «наименее важную». */
function countWins() {
  const wins = {};
  const add = (a, b) => { const k = pairKey(a, b); wins[k] = (wins[k] || 0) + 1; };

  state.ans.forEach((answer, i) => {
    state.design[i].forEach(v => {
      if (v === answer.best) return;
      add(answer.best, v);
      if (v !== answer.worst) add(v, answer.worst);
    });
  });
  return wins;
}

/* Рейтинг ценностей. Сортировка по трём уровням:
   1) score      — (раз «самая важная» − раз «наименее важная») / сколько раз показана
   2) headToHead — при равном score: кто кого чаще обходил в личных встречах
   3) tieBreak   — если и это равно: ответы на уточняющих экранах */
function ranking() {
  const wins = countWins();
  const shown = {}, balance = {}, score = {}, headToHead = {}, tieBreak = {};
  state.pool.forEach(v => { shown[v] = balance[v] = headToHead[v] = tieBreak[v] = 0; });

  state.design.slice(0, state.ans.length).forEach(screen => screen.forEach(v => shown[v]++));
  state.ans.forEach(a => { balance[a.best]++; balance[a.worst]--; });

  state.pool.forEach(v => {
    score[v] = shown[v] ? Math.round(balance[v] / shown[v] * 1000) / 1000 : 0;
  });

  state.pool.forEach(v => state.pool.forEach(u => {
    if (u !== v && score[u] === score[v]) {
      headToHead[v] += (wins[pairKey(v, u)] || 0) - (wins[pairKey(u, v)] || 0);
    }
  }));

  // Чем раньше выбрана на уточнении, тем выше
  state.tb.forEach((v, i) => { tieBreak[v] = state.tb.length - i; });

  const order = state.pool.slice().sort((a, b) =>
    (score[b] - score[a]) || (headToHead[b] - headToHead[a]) || (tieBreak[b] - tieBreak[a]));

  return { order, score, headToHead, tieBreak };
}

// Первая группа ценностей в топе с полностью одинаковым рейтингом (или null)
function findTie() {
  const { order, score, headToHead, tieBreak } = ranking();
  const key = v => `${score[v]}|${headToHead[v]}|${tieBreak[v]}`;

  for (let i = 0; i < Math.min(TOP, order.length); i++) {
    const group = order.filter(v => key(v) === key(order[i]));
    if (group.length > 1) return group;
  }
  return null;
}

// Пары, где выбор менялся (каждая хоть раз была важнее), и хотя бы одна из пары в топе
function conflicts() {
  const wins = countWins();
  const list = [];

  forEachPair(state.pool, (a, b) => {
    const aWins = wins[pairKey(a, b)] || 0;
    const bWins = wins[pairKey(b, a)] || 0;
    const inTop = state.result.includes(a) || state.result.includes(b);
    if (aWins && bWins && inTop) list.push({ a, b, aWins, bWins });
  });

  // Сначала самые «ровные» противоречия, затем самые частые
  return list
    .sort((x, y) =>
      (Math.min(y.aWins, y.bWins) - Math.min(x.aWins, x.bWins)) ||
      ((y.aWins + y.bWins) - (x.aWins + x.bWins)))
    .slice(0, MAX_CONFLICTS);
}

/* =========================================================
   ЭКРАН: ШАГ 2 — СРАВНЕНИЕ
   ========================================================= */
function compare() {
  if (!isTieBreak()) return compareScreen();
  const tie = findTie();
  if (tie) return tieScreen(tie);
  finish();
}

function compareScreen() {
  const i = state.ans.length, total = state.design.length;
  const best = state.curBest, worst = state.curWorst;

  const prompt = !best ? 'Нажми на самую важную'
               : !worst ? 'Теперь — на наименее важную'
               : 'Готово, нажми «Дальше»';

  const options = state.design[i]
    .map((v, k) => optBtn(v, k, v === best ? 'on' : v === worst ? 'no' : ''))
    .join('');

  frame(
    `<div class="row">
       <span class="stepno">Шаг 2 из 2</span>
       <span class="progress-count">${i + 1} / ${total}</span>
     </div>
     <div class="bar"><i style="width:${(i / total) * 100}%"></i></div>
     <h1>Что из этого важнее?</h1>
     <p class="hint">Здесь будут только ценности, выбранные на первом шаге.<br>Теперь на каждом экране отметь две: самую важную и наименее важную.</p>`,
    `<p class="opts-title ${best && !worst ? 'low' : ''}">${prompt}</p>
     <div class="opts ${best ? 'worst' : 'best'}">${options}</div>`,
    backBtn() + resetBtn(),
    nextBtn(best && worst)
  );
}

function tieScreen(group) {
  const best = state.curBest;
  frame(
    `<div class="row"><span class="stepno">Уточнение</span></div>
     <div class="bar"><i style="width:100%"></i></div>
     <h1>Почти готово</h1>
     <p class="hint">Эти ценности оказались для тебя одинаково значимыми. Попробуй решить, какая хотя бы немного перевешивает.</p>`,
    `<p class="opts-title">Какая из них чуть важнее?</p>
     <div class="opts best">${group.map((v, k) => optBtn(v, k, v === best ? 'on' : '')).join('')}</div>`,
    backBtn() + resetBtn(),
    nextBtn(best)
  );
}

// Сравнения закончены: сохранить итог и показать результат
function finish() {
  const order = ranking().order;
  state.result = order.slice(0, TOP);
  state.rest = order.slice(TOP).sort((a, b) => a.localeCompare(b, 'ru'));
  state.date = today();
  go('result');
}

function choose(v) {
  if (v === state.curBest) {
    // Повторное нажатие на «самую важную» снимает весь выбор
    state.curBest = null;
    state.curWorst = null;
  } else if (!state.curBest || isTieBreak()) {
    state.curBest = v;
  } else {
    state.curWorst = (state.curWorst === v) ? null : v;
  }
  render(true);
}

function nextSet() {
  if (!state.curBest) return;

  if (isTieBreak()) {
    state.tb.push(state.curBest);
  } else {
    if (!state.curWorst) return;
    state.ans.push({ best: state.curBest, worst: state.curWorst });
  }

  state.curBest = null;
  state.curWorst = null;
  render();
}

// Шаг назад: сначала снимаем текущий выбор, потом откатываем ответы
function undo() {
  if (state.curWorst) { state.curWorst = null; return render(true); }
  if (state.curBest)  { state.curBest = null;  return render(true); }
  if (state.tb.length)  { state.tb.pop();  return render(); }
  if (state.ans.length) { state.ans.pop(); return render(); }
  state.sel = state.pool.slice();
  go('pick');
}

function backFromResult() {
  state.step = 'compare';
  undo();
}

/* =========================================================
   ЭКРАН: РЕЗУЛЬТАТ
   ========================================================= */
function result() {
  const conf = conflicts();
  const rest = state.rest || [];
  const title = state.pool.length <= TOP ? 'Твои ценности' : 'Топ-' + TOP;

  const topHtml = `
    <p class="sub">Главное сейчас</p>
    <p class="hint note">Эти ценности оказались важнее остальных:</p>
    <ol class="res">
      ${state.result.map((v, i) => `<li><span class="num">${i + 1}.</span> ${esc(v)}</li>`).join('')}
    </ol>`;

  const restHtml = !rest.length ? '' : `
    <p class="sub">Также важны</p>
    <p class="hint note">Значимые ценности, которые не попали в топ:</p>
    <ul class="res">
      ${rest.map(v => `<li><span class="dot">•</span> ${esc(v)}</li>`).join('')}
    </ul>`;

  const confHtml = !conf.length ? '' : `
    <p class="sub">Сложный выбор</p>
    <p class="hint note">В парах ниже выбор менялся: то одна ценность была важнее, то другая. Счёт показывает эти противоречия. То, что они есть — абсолютно нормально + их бывает интересно обсудить:</p>
    <ul class="res conf">
      ${conf.map(c => `<li><span class="v">${esc(c.a)}</span><span class="score">${c.aWins} : ${c.bWins}</span><span class="r">${esc(c.b)}</span></li>`).join('')}
    </ul>`;

  // Разделители ставим только между непустыми блоками
  const divider = `<hr class="divider">`;
  const sections = [topHtml, restHtml, confHtml].filter(Boolean).join(divider);
  const support = DONATE_URL ? divider + supportBlock() : '';

  frame(
    `<div class="row"><span class="stepno">Итог · ${state.date}</span></div>
     <h1>${title}</h1>
     <p class="hint">Результат можно скопировать, чтобы сохранить себе или с кем-нибудь поделиться.</p>`,
    sections + support,
    backBtn('backFromResult') + resetBtn(),
    `<button class="primary" data-act="copy">Скопировать</button>`
  );
}

function copyResult(_, btn) {
  const conf = conflicts();
  const rest = state.rest || [];

  const S = '\u00A0'; // неразрывный пробел: Telegram на iPhone не делает из строк список

  let text = `Мои ценности (${state.date})\n\nТоп:\n` +
             state.result.map((v, i) => `${i + 1}.${S}${v}`).join('\n');

  if (rest.length) text += `\n\nТакже важны:\n` + rest.map(v => `-${S}${v}`).join('\n');
  if (conf.length) {
    text += `\n\nСложный выбор (в этих парах выбор менялся, счёт показывает, сколько раз каждая оказывалась важнее):\n` +
            conf.map(c => `-${S}${c.a} ${c.aWins} : ${c.bWins} ${c.b}`).join('\n');
  }

  const done = () => {
    btn.textContent = '✓ Скопировано';
    setTimeout(() => { btn.textContent = 'Скопировать'; }, 2000);
  };
  // Запасной способ для старых браузеров
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    done();
  };
  navigator.clipboard ? navigator.clipboard.writeText(text).then(done, fallback) : fallback();
}

/* =========================================================
   УПРАВЛЕНИЕ
   ========================================================= */
const SCREENS = { intro, pick, compare, result };

// Все кнопки работают через data-act="имя действия"
const ACTIONS = {
  go,
  reset: () => { if (confirm('Начать заново? Ответы удалятся.')) restart(); },
  undo, backFromResult, toggle, untick, afterPick, choose, nextSet,
  copy: copyResult,
  donate: () => flush() // ссылка откроется сама, просто сразу отправляем статистику
};

// Есть ли кнопка в точке клика. pad — запас в пикселях вокруг кнопки
function buttonAt(x, y, sel, pad) {
  return [...app.querySelectorAll(sel)].find(b => {
    const r = b.getBoundingClientRect();
    return x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad;
  });
}

app.addEventListener('click', e => {
  if (e.target.closest('.consent')) return; // галочку согласия не считаем
  const el = e.target.closest('[data-act]');
  if (el) {
    log(el.dataset.act);
    ACTIONS[el.dataset.act](el.dataset.v, el);
    return;
  }
  const off = buttonAt(e.clientX, e.clientY, 'button:disabled', 0);
  if (off) return log('off:' + off.dataset.act);           // нажал серую кнопку
  if (buttonAt(e.clientX, e.clientY, 'button', 12)) log('miss'); // промахнулся рядом
});

app.addEventListener('change', e => {
  if (e.target.id === 'consent') { state.consent = e.target.checked; save(); }
});

// iPhone: без этого не работает :active
document.addEventListener('touchstart', () => {}, { passive: true });

/* --- Клавиатура: цифры выбирают вариант, Enter — «Дальше», Backspace — «Назад» --- */
let digitBuf = '', digitTimer = null;
function clearDigits() { digitBuf = ''; clearTimeout(digitTimer); }

document.addEventListener('keydown', e => {
  if (!state || e.ctrlKey || e.metaKey || e.altKey) return;

  if (e.key === 'Backspace') {
    const back = app.querySelector('.back');
    if (back) { e.preventDefault(); back.click(); }
    return;
  }
  if (state.step !== 'compare') return;

  if (/^[0-9]$/.test(e.key)) {
    e.preventDefault();
    const options = document.querySelectorAll('.opts button');
    const press = () => {
      const target = options[+digitBuf - 1];
      clearDigits();
      if (target) target.click();
    };
    clearTimeout(digitTimer);
    digitBuf += e.key;
    // Если второй цифры быть не может — жмём сразу, иначе ждём
    if (+digitBuf * 10 > options.length) press();
    else digitTimer = setTimeout(press, KEY_DELAY);
  } else if (e.key === 'Enter') {
    if (e.target.closest && e.target.closest('button:not(.opt)')) return;
    e.preventDefault();
    const next = app.querySelector('[data-act="nextSet"]');
    log(next && next.disabled ? 'off:nextSet' : 'nextSet');
    nextSet();
  }
});

/* =========================================================
   ЗАПУСК
   ========================================================= */
function restart() {
  const consent = state ? state.consent : false; // после «Начать заново» галочка сохраняется
  if (state && lastScreen) log('screen', { at: lastScreen.key, ms: activeMs() });
  if (state) flush();   // дослать события старого прохождения
  lastScreen = null;
  state = {
    step: 'intro', order: shuffle(VALUES), sel: [], pool: [], design: [],
    ans: [], curBest: null, curWorst: null, tb: [], result: [], rest: [], date: '',
    sid: newSid(), consent
  };
  render();
}

state = load();
if (state) render(); else restart();
</script>
</body>
